<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comptador Dies de Cole · Virolai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }

:root {
    --bg: #f5f4f3;
    --fg: #000000;
    --btn-bg: rgba(0, 0, 0, 0.06);
    --btn-bg-hover: rgba(0, 0, 0, 0.14);
}
body.alt {
    --bg: #121212;
    --fg: #f5f4f3;
    --btn-bg: rgba(255, 255, 255, 0.10);
    --btn-bg-hover: rgba(255, 255, 255, 0.20);
}

html, body { margin: 0; padding: 0; width: 100%; }

body {
    background-color: var(--bg);
    color: var(--fg);
    transition: background-color .5s ease, color .5s ease;
    position: relative;
    overflow-x: hidden;
    font-family: system-ui, -apple-system, sans-serif;
}

/* ==== ORBE (petita, menys blur = menys RAM GPU) ==== */
.floating-orb {
    position: fixed;
    top: 0;
    left: 0;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle,
                rgba(255, 20, 147, 0.55) 0%,
                rgba(255, 80, 0, 0.35) 45%,
                rgba(255, 180, 0, 0.12) 72%,
                transparent 90%);
    filter: blur(30px);
    pointer-events: none;
    z-index: 0;
    transform: translate3d(0, 0, 0);
    will-change: transform;
    contain: strict;
}

/* ==== THEME BUTTON (sense backdrop-filter) ==== */
#theme-icon {
    position: fixed;
    top: 1.25rem;
    right: 1.25rem;
    z-index: 50;
    padding: 0.5rem;
    border-radius: 9999px;
    border: none;
    background-color: var(--btn-bg);
    color: var(--fg);
    cursor: pointer;
    transition: opacity .5s ease, background-color .2s ease;
    opacity: 0;
    pointer-events: none;
}
#theme-icon:hover { background-color: var(--btn-bg-hover); }
#theme-icon.visible { opacity: 1; pointer-events: auto; }
#theme-icon svg { display: block; }

/* ==== MAIN ==== */
.main-wrap {
    position: relative;
    z-index: 10;
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
}

.main-container {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', 'Arial Narrow', sans-serif;
    font-size: 13vw;
    letter-spacing: -0.05em;
    line-height: 1;
    padding: 0 1rem;
    flex-shrink: 0;
}
@media (min-width: 768px) {
    .main-container { font-size: 10vw; }
}

.group {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
}

.group-label {
    font-size: 2.2vw;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.5;
    margin-top: 0.5rem;
    font-family: system-ui, -apple-system, sans-serif;
    font-weight: 700;
}
@media (min-width: 768px) {
    .group-label { font-size: 1vw; }
}

/* ==== WHEELS ==== */
.wheel-mask {
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 12%, #000 88%, transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, #000 12%, #000 88%, transparent 100%);
    flex-shrink: 0;
}

.number-wheel {
    display: inline-flex;
    justify-content: center;
    align-items: flex-start;
    overflow: hidden;
    height: 1em;
    line-height: 1em;
    vertical-align: baseline;
    position: relative;
    flex-shrink: 0;
    contain: layout paint;
}

.number-track {
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    backface-visibility: hidden;
}

.number-track > span {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 1em;
    min-height: 1em;
    max-height: 1em;
    line-height: 1em;
    flex: 0 0 1em;
    white-space: nowrap;
}

.colon {
    font-size: 0.22em;
    opacity: 0.5;
    line-height: 1;
    align-self: center;
    user-select: none;
    margin-left: 0.2em;
    margin-right: 0.2em;
    transform: translateY(calc(-1.3vw - 0.25rem));
}
@media (min-width: 768px) {
    .colon {
        margin-left: 0.25em;
        margin-right: 0.25em;
        transform: translateY(calc(-0.6vw - 0.25rem));
    }
}

/* ==== SCROLL SECTION ==== */
#scroll-section {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 72rem;
    margin: 0 auto;
    padding: 4rem 1rem 6rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity .8s ease;
}
#scroll-section.visible { opacity: 1; pointer-events: auto; }

#small-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 3.5rem 2rem;
}
@media (min-width: 768px) {
    #small-grid { grid-template-columns: repeat(3, 1fr); }
}

.slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    content-visibility: auto;
    contain-intrinsic-size: 0 8rem;
}

.small-title {
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 0.7rem;
    font-family: system-ui, -apple-system, sans-serif;
    font-weight: 700;
    text-align: center;
    min-height: 1.2em;
}

.small-countdown-wrap {
    font-size: clamp(1.5rem, 2.6vw, 2.4rem);
    font-family: 'Bebas Neue', 'Arial Narrow', sans-serif;
    letter-spacing: -0.05em;
    display: flex;
    align-items: center;
    justify-content: center;
}

.small-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
}

.small-colon {
    font-size: 0.5em;
    opacity: 0.55;
    line-height: 1;
    align-self: center;
    user-select: none;
    margin-left: 0.2em;
    margin-right: 0.2em;
    transform: translateY(-0.05em);
}
</style>
</head>
<body class="w-full relative">

    <div id="glowing-orb" class="floating-orb"></div>

    <button id="theme-icon" aria-label="Canviar tema">
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             style="display:none">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
    </button>

    <div class="main-wrap">
        <div class="main-container">
            <div class="group">
                <div class="wheel-mask">
                    <div class="number-wheel"><div class="number-track" id="days-track"></div></div>
                </div>
                <span class="group-label">DIES</span>
            </div>
            <span class="colon">:</span>
            <div class="group">
                <div class="wheel-mask">
                    <div class="number-wheel"><div class="number-track" id="hours-tens-track"></div></div>
                    <div class="number-wheel"><div class="number-track" id="hours-units-track"></div></div>
                </div>
                <span class="group-label">HORES</span>
            </div>
            <span class="colon">:</span>
            <div class="group">
                <div class="wheel-mask">
                    <div class="number-wheel"><div class="number-track" id="mins-tens-track"></div></div>
                    <div class="number-wheel"><div class="number-track" id="mins-units-track"></div></div>
                </div>
                <span class="group-label">MINUTS</span>
            </div>
            <span class="colon">:</span>
            <div class="group">
                <div class="wheel-mask">
                    <div class="number-wheel"><div class="number-track" id="secs-tens-track"></div></div>
                    <div class="number-wheel"><div class="number-track" id="secs-units-track"></div></div>
                </div>
                <span class="group-label">SEGONS</span>
            </div>
        </div>
    </div>

    <section id="scroll-section">
        <div id="small-grid"></div>
    </section>

<script>
(function () {
    'use strict';

    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var allWheels = [];

    /* =========================================================
       1. ORBE ANIMADA (30fps, no 60)
       ========================================================= */
    var orb = document.getElementById('glowing-orb');
    var orbRunning = !reduceMotion;
    var lastOrbFrame = 0;

    function animateOrb(now) {
        if (!orbRunning) return;
        if (now - lastOrbFrame > 33) {
            var t = now * 0.0006;
            var x = window.innerWidth  / 2 + Math.sin(t * 0.8) * window.innerWidth  * 0.38;
            var y = window.innerHeight / 2 + Math.cos(t * 0.5) * window.innerHeight * 0.32;
            orb.style.transform = 'translate3d(' + (x - 160) + 'px,' + (y - 160) + 'px,0)';
            lastOrbFrame = now;
        }
        requestAnimationFrame(animateOrb);
    }
    if (orbRunning) requestAnimationFrame(animateOrb);

    /* =========================================================
       2. ICONA DE TEMA
       ========================================================= */
    var themeIcon = document.getElementById('theme-icon');
    var iconSun   = document.getElementById('icon-sun');
    var iconMoon  = document.getElementById('icon-moon');
    var hideTimer = null;

    function updateThemeIcon() {
        var isDark = document.body.classList.contains('alt');
        iconSun.style.display  = isDark ? 'none'  : 'block';
        iconMoon.style.display = isDark ? 'block' : 'none';
    }
    function revealIcon() {
        themeIcon.classList.add('visible');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(function () {
            themeIcon.classList.remove('visible');
        }, 2200);
    }
    document.addEventListener('mousemove', revealIcon, { passive: true });
    document.addEventListener('touchstart', revealIcon, { passive: true });
    themeIcon.addEventListener('click', function () {
        document.body.classList.toggle('alt');
        updateThemeIcon();
        revealIcon();
    });
    updateThemeIcon();

    /* =========================================================
       3. RODET NUMÈRIC (repeats=3 = mínim segur per recentrar)
       ========================================================= */
    var TRANSITION = 'transform .55s cubic-bezier(.22, 1, .36, 1)';
    var digitWidthCache = {};
    var measureCanvas = document.createElement('canvas');
    var measureCtx = measureCanvas.getContext('2d');

    function measureDigit(digit, fontSize) {
        var key = digit + '@' + fontSize.toFixed(2);
        var w = digitWidthCache[key];
        if (w !== undefined) return w;
        measureCtx.font = '400 ' + fontSize + 'px "Bebas Neue", "Arial Narrow", sans-serif';
        w = measureCtx.measureText(String(digit)).width;
        digitWidthCache[key] = w;
        return w;
    }

    function Wheel(trackEl, maxDigit, repeats) {
        this.track     = trackEl;
        this.maxDigit  = maxDigit;
        this.L         = maxDigit + 1;
        this.repeats   = repeats || 3;
        this.total     = this.L * this.repeats;
        this.pos       = 0;
        this.digit     = null;
        this.step      = 0;
        this.wheelEl   = trackEl.parentElement;

        var html = '';
        for (var r = 0; r < this.repeats; r++) {
            for (var d = maxDigit; d >= 0; d--) {
                html += '<span>' + d + '</span>';
            }
        }
        trackEl.innerHTML = html;

        allWheels.push(this);
    }

    Wheel.prototype._indexOf = function (digit) { return this.maxDigit - digit; };

    Wheel.prototype._measure = function () {
        var fs = parseFloat(window.getComputedStyle(this.track).fontSize);
        this.step = (isFinite(fs) && fs > 0) ? fs : 16;
    };

    Wheel.prototype._fitWidth = function () {
        if (this.digit === null) return;
        var w = measureDigit(this.digit, this.step);
        this.wheelEl.style.width = w + 'px';
    };

    Wheel.prototype._render = function (animate) {
        this.track.style.transition = animate ? TRANSITION : 'none';
        if (!this.step) this._measure();
        this.track.style.transform =
            'translate3d(0,' + (-this.pos * this.step) + 'px,0)';
    };

    Wheel.prototype.remeasure = function () {
        this._measure();
        this._render(false);
        this._fitWidth();
    };

    Wheel.prototype.reset = function (digit) {
        if (digit > this.maxDigit) digit = this.maxDigit;
        if (digit < 0) digit = 0;
        this.digit = digit;
        this.pos = (this.repeats >= 2 ? this.L : 0) + this._indexOf(digit);
        this._render(false);
        this._fitWidth();
        void this.track.offsetHeight;
    };

    Wheel.prototype.set = function (digit, animate) {
        if (digit > this.maxDigit) digit = this.maxDigit;
        if (digit < 0) digit = 0;
        if (digit === this.digit) return;
        if (!animate || this.digit === null) { this.reset(digit); return; }
        var L = this.L;
        var steps = ((this.digit - digit) % L + L) % L;
        if (steps === 0) return;
        if (steps * 2 > L) { this.reset(digit); return; }
        var lastIndex = this.total - 1;
        if (this.repeats >= 3 && this.pos + steps > lastIndex) {
            this.pos -= L * (this.repeats - 2);
            this._render(false);
            void this.track.offsetHeight;
        }
        this.pos += steps;
        this.digit = digit;
        this._render(true);
        this._fitWidth();
    };

    var resizeTimer = null;
    window.addEventListener('resize', function () {
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
            digitWidthCache = {};
            for (var i = 0; i < allWheels.length; i++) allWheels[i].remeasure();
        }, 150);
    }, { passive: true });

    /* =========================================================
       4. COMPTE PRINCIPAL
       ========================================================= */
    var MAIN_TARGET = new Date(2027, 5, 18, 15, 0, 0).getTime();

    var daysTrackEl = document.getElementById('days-track');
    var hTensWheel  = new Wheel(document.getElementById('hours-tens-track'),  2, 4);
    var hUnitsWheel = new Wheel(document.getElementById('hours-units-track'), 9, 3);
    var mTensWheel  = new Wheel(document.getElementById('mins-tens-track'),   5, 4);
    var mUnitsWheel = new Wheel(document.getElementById('mins-units-track'),  9, 3);
    var sTensWheel  = new Wheel(document.getElementById('secs-tens-track'),   5, 4);
    var sUnitsWheel = new Wheel(document.getElementById('secs-units-track'),  9, 3);
    var daysWheel = null;

    function updateMain(animate) {
        var diff = Math.max(0, MAIN_TARGET - Date.now());
        var totalSeconds = Math.floor(diff / 1000);
        var days    = Math.floor(totalSeconds / 86400);
        var hours   = Math.floor((totalSeconds % 86400) / 3600);
        var minutes = Math.floor((totalSeconds % 3600) / 60);
        var seconds = totalSeconds % 60;

        if (!daysWheel) daysWheel = new Wheel(daysTrackEl, Math.max(days, 0), 1);
        daysWheel.set(days, animate);

        hTensWheel.set(Math.floor(hours / 10), animate);
        hUnitsWheel.set(hours % 10, animate);
        mTensWheel.set(Math.floor(minutes / 10), animate);
        mUnitsWheel.set(minutes % 10, animate);
        sTensWheel.set(Math.floor(seconds / 10), animate);
        sUnitsWheel.set(seconds % 10, animate);
    }
    updateMain(false);

    /* =========================================================
       5. GENERACIÓ D'ESDEVENIMENTS (només 6 anys en lloc de 17)
       ========================================================= */
    function easter(year) {
        var a = year % 19;
        var b = Math.floor(year / 100);
        var c = year % 100;
        var d = Math.floor(b / 4);
        var e = b % 4;
        var f = Math.floor((b + 8) / 25);
        var g = Math.floor((b - f + 1) / 3);
        var h = (19 * a + b - d - g + 15) % 30;
        var i = Math.floor(c / 4);
        var k = c % 4;
        var l = (32 + 2 * e + 2 * i - h - k) % 7;
        var m = Math.floor((a + 11 * h + 22 * l) / 451);
        var month = Math.floor((h + l - 7 * m + 114) / 31);
        var day = ((h + l - 7 * m + 114) % 31) + 1;
        return new Date(year, month - 1, day);
    }
    function addDays(date, n) {
        var d = new Date(date.getTime());
        d.setDate(d.getDate() + n);
        return d;
    }

    function generateAllEvents() {
        var events = [];
        var idCounter = 0;
        function push(date, title) {
            events.push({ id: 'e' + (idCounter++), date: date, title: title });
        }

        var thisYear = new Date().getFullYear();
        var startYear = thisYear;
        var endYear = thisYear + 5;

        for (var y = startYear; y <= endYear; y++) {
            var e = easter(y);

            push(new Date(y, 8, 11), 'La Diada (11 de Setembre)');
            push(new Date(y, 8, 24), 'La Mercè');
            push(new Date(y, 9, 12), 'El Pilar (12 d\'Octubre)');
            push(new Date(y, 10, 1), 'Tots Sants');
            push(new Date(y, 11, 6), 'Dia de la Constitució');
            push(new Date(y, 11, 8), 'La Immaculada');
            push(new Date(y, 11, 24), 'Nit de Nadal');
            push(new Date(y, 11, 25), 'Nadal');
            push(new Date(y, 11, 26), 'Sant Esteve');
            push(new Date(y, 11, 31), 'Nit de Cap d\'Any');

            push(new Date(y + 1, 0, 1), 'Cap d\'Any');
            push(new Date(y + 1, 0, 6), 'Dia de Reis');
            push(addDays(e, -47), 'Carnaval');
            push(addDays(e, -3),  'Dijous Sant');
            push(addDays(e, -2),  'Divendres Sant');
            push(addDays(e, 1),   'Dilluns de Pasqua');
            push(addDays(e, 50),  '2a Pasqua (Pentecosta)');

            push(new Date(y, 4, 1),  '1 de Maig (Dia del Treballador)');
            push(new Date(y, 5, 23), 'Revetlla de Sant Joan');
            push(new Date(y, 5, 24), 'Sant Joan');

            push(new Date(y, 8, 8), 'Tornada a l\'escola');
            var fi1r = new Date(y, 11, 22);
            push(fi1r,              'Últim dia abans de Nadal');
            push(addDays(fi1r, 1),  'Vacances de Nadal');

            push(new Date(y + 1, 0, 8), 'Tornada de Nadal');
            var palm = addDays(easter(y + 1), -7);
            var fi2n = addDays(palm, -2);
            push(fi2n,              'Últim dia abans de Setmana Santa');
            push(addDays(fi2n, 1),  'Vacances de Setmana Santa');
            push(addDays(easter(y + 1), 2), 'Tornada de Setmana Santa');

            var fiCurs = new Date(y + 1, 5, 20);
            push(fiCurs,            'Últim dia de classe');
            push(addDays(fiCurs, 1),'Vacances d\'estiu');
        }

        var seen = {};
        var unique = [];
        for (var i = 0; i < events.length; i++) {
            var key = events[i].date.getTime() + '|' + events[i].title;
            if (!seen[key]) { seen[key] = true; unique.push(events[i]); }
        }
        unique.sort(function (a, b) { return a.date - b.date; });
        return unique;
    }

    var ALL_EVENTS = generateAllEvents();

    var cachedNext = null;
    var cachedNextFirstTime = 0;

    function computeNext(count) {
        var now = Date.now();
        var result = [];
        for (var i = 0; i < ALL_EVENTS.length && result.length < count; i++) {
            if (ALL_EVENTS[i].date.getTime() > now) result.push(ALL_EVENTS[i]);
        }
        return result;
    }

    function getNextEvents(count) {
        var now = Date.now();
        if (cachedNext && cachedNextFirstTime > now && cachedNext.length >= count) {
            return cachedNext;
        }
        cachedNext = computeNext(count);
        cachedNextFirstTime = cachedNext.length
            ? cachedNext[0].date.getTime()
            : now + 3600000;
        return cachedNext;
    }

    /* =========================================================
       6. SLOTS (repeats=3, mínim per recentrar)
       ========================================================= */
    var NUM_SLOTS = 12;
    var slots = [];
    var grid = document.getElementById('small-grid');
    var visibleSlots = new Set();

    var slotObserver = new IntersectionObserver(function (entries) {
        for (var i = 0; i < entries.length; i++) {
            var entry = entries[i];
            var idx = parseInt(entry.target.dataset.slotIdx, 10);
            if (entry.isIntersecting) {
                visibleSlots.add(idx);
                /* Quan entra a la vista, actualitzem immediatament */
                if (slots[idx] && slots[idx].event) {
                    slots[idx].tick(true);
                }
            } else {
                visibleSlots.delete(idx);
            }
        }
    }, { rootMargin: '200px' });

    function buildGroupHTML(prefix, wheels) {
        var html = '<div class="small-group"><div class="wheel-mask">';
        for (var i = 0; i < wheels.length; i++) {
            html += '<div class="number-wheel"><div class="number-track" id="' +
                    prefix + '-' + wheels[i] + '"></div></div>';
        }
        html += '</div></div>';
        return html;
    }

    function buildSlotHTML(idx) {
        var p = 'slot-' + idx;
        return '<h3 id="' + p + '-title" class="small-title"></h3>' +
               '<div class="small-countdown-wrap">' +
                   buildGroupHTML(p, ['daysH','daysT','daysU']) +
                   '<span class="small-colon">:</span>' +
                   buildGroupHTML(p, ['ht','hu']) +
                   '<span class="small-colon">:</span>' +
                   buildGroupHTML(p, ['mt','mu']) +
                   '<span class="small-colon">:</span>' +
                   buildGroupHTML(p, ['st','su']) +
               '</div>';
    }

    function Slot(idx) {
        this.idx = idx;
        var wrapper = document.createElement('div');
        wrapper.className = 'slot';
        wrapper.dataset.slotIdx = String(idx);
        wrapper.innerHTML = buildSlotHTML(idx);
        grid.appendChild(wrapper);
        this.el = wrapper;
        this.titleEl = document.getElementById('slot-' + idx + '-title');
        this.event = null;
        var p = 'slot-' + idx;
        this.wheels = {
            daysH: new Wheel(document.getElementById(p + '-daysH'), 9, 3),
            daysT: new Wheel(document.getElementById(p + '-daysT'), 9, 3),
            daysU: new Wheel(document.getElementById(p + '-daysU'), 9, 3),
            ht:    new Wheel(document.getElementById(p + '-ht'),    2, 4),
            hu:    new Wheel(document.getElementById(p + '-hu'),    9, 3),
            mt:    new Wheel(document.getElementById(p + '-mt'),    5, 4),
            mu:    new Wheel(document.getElementById(p + '-mu'),    9, 3),
            st:    new Wheel(document.getElementById(p + '-st'),    5, 4),
            su:    new Wheel(document.getElementById(p + '-su'),    9, 3)
        };
        slotObserver.observe(wrapper);
    }

    Slot.prototype.assign = function (newEvent) {
        if (this.event === newEvent) return false;
        this.event = newEvent;
        if (newEvent) {
            this.titleEl.textContent = newEvent.title;
            this.el.style.display = '';
            this._writeWheels(false);
        } else {
            this.titleEl.textContent = '';
            this.el.style.display = 'none';
        }
        return true;
    };

    Slot.prototype._writeWheels = function (animate) {
        if (!this.event) return;
        var diff = Math.max(0, this.event.date.getTime() - Date.now());
        var totalSeconds = Math.floor(diff / 1000);

        var days    = Math.min(Math.floor(totalSeconds / 86400), 999);
        var hours   = Math.floor((totalSeconds % 86400) / 3600);
        var minutes = Math.floor((totalSeconds % 3600) / 60);
        var seconds = totalSeconds % 60;

        var w = this.wheels;
        w.daysH.set(Math.floor(days / 100) % 10, animate);
        w.daysT.set(Math.floor(days / 10) % 10, animate);
        w.daysU.set(days % 10, animate);
        w.ht.set(Math.floor(hours / 10), animate);
        w.hu.set(hours % 10, animate);
        w.mt.set(Math.floor(minutes / 10), animate);
        w.mu.set(minutes % 10, animate);
        w.st.set(Math.floor(seconds / 10), animate);
        w.su.set(seconds % 10, animate);
    };

    Slot.prototype.tick = function (animate) {
        this._writeWheels(animate);
    };

    for (var i = 0; i < NUM_SLOTS; i++) slots.push(new Slot(i));

    function refreshSlots(animate) {
        var next = getNextEvents(NUM_SLOTS);
        for (var i = 0; i < NUM_SLOTS; i++) {
            var ev = next[i] || null;
            var changed = slots[i].assign(ev);
            /* Només actualitzem si és visible o acaba de canviar */
            if (ev && (changed || visibleSlots.has(i))) {
                slots[i].tick(animate);
            }
        }
    }

    refreshSlots(false);

    /* =========================================================
       7. SCROLL SECTION
       ========================================================= */
    var scrollSection = document.getElementById('scroll-section');
    var sectionVisible = false;

    function checkScroll() {
        var rect = scrollSection.getBoundingClientRect();
        var isVis = rect.top < window.innerHeight * 0.9;
        if (isVis !== sectionVisible) {
            sectionVisible = isVis;
            if (isVis) scrollSection.classList.add('visible');
            else scrollSection.classList.remove('visible');
            if (isVis) refreshSlots(false);
        }
    }
    window.addEventListener('scroll', checkScroll, { passive: true });
    window.addEventListener('resize', checkScroll, { passive: true });
    checkScroll();

    /* =========================================================
       8. BUCLE D'ACTUALITZACIÓ
       ========================================================= */
    var tickTimer = null;

    function scheduleTick() {
        if (tickTimer) return;
        var delay = 1000 - (Date.now() % 1000);
        tickTimer = setTimeout(function () {
            tickTimer = null;
            updateMain(true);
            if (sectionVisible) refreshSlots(true);
            scheduleTick();
        }, delay);
    }
    scheduleTick();

    document.addEventListener('visibilitychange', function () {
        orbRunning = !document.hidden && !reduceMotion;
        if (orbRunning) requestAnimationFrame(animateOrb);

        if (document.hidden) {
            if (tickTimer) { clearTimeout(tickTimer); tickTimer = null; }
        } else {
            updateMain(true);
            if (sectionVisible) refreshSlots(true);
            scheduleTick();
        }
    });

})();
</script>
</body>
</html>
